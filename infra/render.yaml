databases:
  - name: orders-and-settlements-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: orders-and-settlements-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    preDeployCommand: npm run migrate
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DATABASE_URL
        fromDatabase:
          name: orders-and-settlements-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        sync: false
